name: Build model & deploy viewer

on:
  push:
    branches: [main]
    paths:
      - "model/**"
      - "web/**"
      - "tools/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      tolerance:
        description: "Linearni tolerance triangulace v mm (vetsi = mensi soubor)"
        required: false
        default: "0.5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install CAD kernel
        run: pip install -r tools/requirements.txt

      - name: Find STEP model
        id: find
        run: |
          step=$(find model -maxdepth 1 -type f \( -iname '*.step' -o -iname '*.stp' \) | sort | head -n 1)
          if [ -z "$step" ]; then
            echo "Ve slozce model/ neni zadny .step soubor - nasadi se demo mistnost." >> "$GITHUB_STEP_SUMMARY"
            echo "found=" >> "$GITHUB_OUTPUT"
          else
            echo "Pouzivam model: $step" >> "$GITHUB_STEP_SUMMARY"
            echo "found=$step" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert STEP to GLB
        if: steps.find.outputs.found != ''
        run: |
          python tools/step_to_glb.py \
            "${{ steps.find.outputs.found }}" \
            web/model/room.glb \
            --tolerance "${{ inputs.tolerance || '0.5' }}"

      - name: Report size
        if: steps.find.outputs.found != ''
        run: |
          size=$(du -h web/model/room.glb | cut -f1)
          echo "Vysledny GLB: **$size**" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache-bust assets
        run: |
          v="${GITHUB_SHA::8}"
          # každé nasazení dostane vlastní URL pro CSS i pro všechny moduly,
          # takže prohlížeč nikdy nesmíchá starý index.html s novým JS
          sed -i -E "s#(\./(css/style\.css|js/main\.js))\"#\1?v=$v\"#g" web/index.html
          sed -i -E "s#<html#<html data-build=\"$v\"#" web/index.html
          sed -i -E "s#from \"(\./[a-z-]+\.js)\"#from \"\1?v=$v\"#g" web/js/*.js
          echo "Verze assetů: $v" >> "$GITHUB_STEP_SUMMARY"
          grep -o 'js/main.js?v=[0-9a-f]*' web/index.html || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
